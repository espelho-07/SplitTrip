# ==============================================================================
# Render Infrastructure Blueprint for Kith Backend (Staging)
# ==============================================================================

services:
  - type: web
    name: kith-staging-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://kith.app,http://localhost:3000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Injected via Render Dashboard from Supabase Staging Project
