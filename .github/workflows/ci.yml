name: Kith CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend API Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Run Backend Regression Test Suite
        run: npm test

  flutter-test-and-build:
    name: Flutter Analyze, Test & Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 for Android Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & Integration Test Suites
        run: flutter test

      - name: Provision Google Services Configuration
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            mkdir -p android/app
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "975934560976",
              "project_id": "amazing-pipe-484506-t8",
              "storage_bucket": "amazing-pipe-484506-t8.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:975934560976:android:19fb2907f5a3d2e8cdbe6f",
                  "android_client_info": {
                    "package_name": "com.nirniq.kith"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "975934560976-s1podmdjsd712456iies9je5sso82nll.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "dummy_ci_key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Release AppBundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: kith-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Upload Release AppBundle Artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: kith-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
