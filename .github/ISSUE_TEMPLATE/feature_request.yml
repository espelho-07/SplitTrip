name: Feature Request
description: Propose a new feature, workflow improvement, or enhancement for Kith
title: "[FEATURE]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        We love ideas! Please describe the problem you want to solve and your proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "e.g. When traveling in areas with no cellular signal..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe your proposed solution
      description: Detailed explanation of how this feature should work from a user and technical perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
